<!doctype html>

<!---UI skeleton of project-->
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>DissonanceLab</title>
  <link href="https://fonts.cdnfonts.com/css/digital-7-mono" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f4b64a;
      color: #000000;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      background: #111;
      padding: 15px 10px 10px 20px;
      border-radius: 8px;
      border: 1px solid #898888;
      margin-top: 0.5rem;
      margin-bottom: 0.3rem;
    }

    #layout {
      display: flex;
      width: 100%;
      max-width: 1500px;
      gap: 20px;
      align-items: stretch;
      padding: 0 16px 16px 16px;
      box-sizing: border-box;
    }

    #sidebar {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 300px;
      flex-shrink: 0;
      background: linear-gradient(165deg, #a7a7a7, #6c6c6c);
      padding-right: 12px;
      padding-left: 12px;
      padding-top: 12px;
      padding-bottom: 12px;
      border-radius: 10px;


      /* scrollable stuff */
      height: calc(100vh - 110px);
      /* adjust if header is taller/shorter */
      overflow-y: auto;
      overflow-x: hidden;

    }

    #sidebar {
      border: 1px solid #444;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.1),
        0 2px 8px rgba(0, 0, 0, 0.3);
    }

    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 12px;
      min-width: 0;
      /* stops overflow issues */
    }

    #maincontrols {
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      /* wraps nicely on smaller widths */
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 10px;
      background: #c7c7c7;
      border: 1px solid #373737;
      border-radius: 8px;
    }



    .slider-row {
      display: flex;
      align-items: center;
      gap: 30px;
    }

    .slider-row input[type="range"] {
      flex: 1;
    }

    .slider-row span {
      font-family: 'Digital-7 Mono', monospace;
      font-size: 1.2rem;
      text-shadow: 0 0 5px #ff0000, 0 0 10px #ff9500;
      color: #ffb2b2;
      background: #111;
      padding: 2.5px 4px 0 0;
      border-radius: 2px;
      margin-right: 10px;
      text-align: right;
      border: 1px solid #333;
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.6);
      width: 45px;
    }

    .peak-picker-control label.small {
      margin-bottom: 22px;
      /* space between each slider */
    }

    #visualisations {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    #vizRow {
      display: flex;
      align-items: flex-start;
      gap: 16px;
      width: 100%;
    }




    #tuningPanel {
      width: 320px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    h1 {
      font-family: 'Digital-7 Mono', monospace;
      font-size: 2.5rem;
      letter-spacing: 0.3em;
      text-shadow: 0 0 5px #bed5ff, 0 0 10px #0059ff;
      color: #b2d6ff;
    }

    .row {
      display: flex;
      gap: 16px;
      align-items: flex-start;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 10px;
      max-width: 1100px;
      width: 100%;
    }


    #dissonanceMeter {
      width: 40px;
      height: 200px;
      background: #222;
      border-radius: 4px;
      position: relative;
      overflow: hidden;
    }

    #dissonanceMeterFill {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 0%;
      transition: height 0.03s linear;
    }

    .previewBtn {
      align-self: flex-start;
      padding: 3px 10px;
      font-size: 13px;
      cursor: pointer;
      border: 1px solid #555;
      border-radius: 4px;
      background: #e8e8e8;
      margin: 2px 0 4px 0;
    }

    .previewBtn.previewing {
      background: #18cf00;
      border-color: rgb(24, 80, 0);
      color: rgb(24, 80, 0);
    }

    .engineName {
      font-weight: 600;
    }

    .controls {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
      justify-content: flex-start;
    }

    canvas {
      background: #fff;
      width: 100%;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    #sidebar .col>label:first-of-type {
      padding: 10px 10px;

    }

    #sidebar .sliderLabel {
      margin-bottom: 8px;
      /* adjust as needed */
    }

    #sidebar .col {
      border: 2px solid #444;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.1),
        0 2px 8px rgba(0, 0, 0, 0.3);
    }

    #viz {

    }

    #viz2 {
      height: 24vh;
    }

    #visualisations .viz-box {
      min-width: 0;
    }

    #visualisations .col,

      border: 1px solid #676767;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.1),
        0 2px 8px rgba(0, 0, 0, 0.3);
    }

    .meter-module {
  width: 120px;
  min-width: 120px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
}

#dissonanceTimeline {
  width: 100%;
  height: 18px;
  display: block;
  background: #222;
  border: 1px solid #444;
  border-radius: 4px;
}

    .peak-picker-control {

    #auditionCents {

    }

    .engineTitle {

    }

    button,

    select {

    }

    .chip {

      gap: 6px;
      font-size: 14px;

    }

    .spectrum-row {

    }

    .peak-picker-control {

    }

      height: 30px;

      align-items: stretch;
    }

    label {

    }

    #pianoControlsA {

    .canvas-with-slider {

      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .canvas-with-slider canvas {

    }

    .note {

      color: #666;
      line-height: 1.3;
      max-width: 240px;
      margin-top: -4px;
      margin-bottom: 4px;
    }

    .sliderLabel {
      display: flex;
      flex-direction: column;
      gap: 0px;
      margin: 0;
      padding-left: 0.5em;
    }

    .sliderHeader {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      width: 100%;
    }

    .sliderTitle {
      text-align: left;
    }

    .sliderValue {
      text-align: right;
      min-width: 48px;
    }


    .dissonance-section {
      display: flex;
      gap: 20px;
      align-items: stretch;
    }

    .dissonance-section .viz-box {
      flex: 1;
    }

    .meter-module {
      width: 120px;
      min-width: unset;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .meter-module .dissonance-meter-vertical {
      flex: 1;
      width: 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 35px;
      height: 68px;
      background: url('slider.png') center/contain no-repeat;
      border: none;
      cursor: pointer;
      margin-top: -33px;
      /* (track height - thumb height) / 2 */
    }

    input[type="range"]::-moz-range-thumb {
      width: 24px;
      height: 40px;
      background: url('slider.png') center/contain no-repeat;
      border: none;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      filter: drop-shadow(2px 4px 6px rgba(0, 0, 0, 0.5));
    }

    input[type="range"]::-moz-range-thumb {
      filter: drop-shadow(2px 4px 6px rgba(0, 0, 0, 0.5));
    }

    /* The track (groove) */
    input[type="range"]::-webkit-slider-runnable-track {
      height: 4px;
      background: linear-gradient(180deg, #1a1a1a 0%, #2a2a2a 50%, #1a1a1a 100%);
      border-radius: 4px;
      border: 1px solid #444;
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.6);
    }

    /* Firefox track */
    input[type="range"]::-moz-range-track {
      height: 4px;
      background: linear-gradient(180deg, #1a1a1a 0%, #2a2a2a 50%, #1a1a1a 100%);
      border-radius: 4px;
      border: 1px solid #444;
    }

    .trackBottomRow {
      display: flex;
      justify-content: space-between;
      align-items: end;
      width: auto;
      gap: 10px;
      margin-top: 4px;
      margin-left: -4px;
      margin-right: -4px;
      background: #b0b0b0;
      padding: 6px 8px;
      border-radius: 4px;
      box-sizing: border-box;
    }

    .groupControl {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      margin: 0;
    }

    .groupLabel {
      margin-bottom: 2px;
    }

    .previewBtn {
      margin: 0;
      align-self: flex-end;
    }
  </style>
</head>

        </label>

        <label class="small sliderLabel">

            <span class="sliderTitle">Sample Start:</span>
            <span class="sliderValue" id="cropStartValA">0.00</span>
          </div>

        </label>

        <label class="small sliderLabel">
          <div class="sliderHeader">
            <span class="sliderTitle">Sample End:</span>
            <span class="sliderValue" id="cropEndValA">1.00</span>
          </div>
          <input id="cropEndA" type="range" min="0" max="1" value="1" step="0.01">
        </label>

        <label class="small sliderLabel">
          <div class="sliderHeader">
            <span class="sliderTitle">File Pitch:</span>
            <span class="sliderValue" id="filePitchValA">1.00</span>
          </div>
          <input id="filePitchA" type="range" min="0.25" max="4" value="1" step="0.01">
        </label>

        <label class="small sliderLabel">
          <div class="sliderHeader">
            <span class="sliderTitle">Volume:</span>
            <span class="sliderValue" id="volValA">1.00</span>
          </div>
          <input id="volA" type="range" min="0" max="1" value="1" step="0.01">
        </label>

        <div class="trackBottomRow">
          <label class="small groupControl">
            <span class="groupLabel">Group:</span>
            <select id="showA">
              <option value="off" selected>Off</option>
              <option value="context">Context</option>
              <option value="complement">Complement</option>
            </select>
          </label>

          <button id="previewBtnA" class="previewBtn"
            onclick="{ const t=tracks.find(t=>t.id==='A'); t?._previewSrc ? t.previewStop() : t?.previewPlay(); }">
            ▶ Preview

            <span class="sliderValue" id="filePitchValF">1.00</span>
          </div>
          <input id="filePitchF" type="range" min="0.25" max="4" value="1" step="0.01">
        </label>

        <label class="small sliderLabel">
          <div class="sliderHeader">
            <span class="sliderTitle">Volume:</span>
            <span class="sliderValue" id="volValF">1.00</span>
          </div>
          <input id="volF" type="range" min="0" max="1" value="1" step="0.01">
        </label>

        <div class="trackBottomRow">
          <label class="small groupControl">
            <span class="groupLabel">Group:</span>
            <select id="showF">
              <option value="off" selected>Off</option>
              <option value="context">Context</option>
              <option value="complement">Complement</option>
            </select>
          </label>

          <button id="previewBtnF" class="previewBtn"
            onclick="{ const t=tracks.find(t=>t.id==='F'); t?._previewSrc ? t.previewStop() : t?.previewPlay(); }">
            ▶ Preview
          </button>
        </div>
      </div>

    </div>


    <div id="main">
      <div id="vizRow">

        <div id="visualisations">
          <div class="col viz-box">
            <div class="engineTitle">
              <span class="engineName">Spectrum</span>
            </div>

            <div class="spectrum-row">
              <div class="canvas-with-slider">
                <canvas id="viz"></canvas>
                <label class="small sliderLabel">
                  <div class="sliderHeader">
                    <span class="sliderTitle">X-Zoom:</span>
                  </div>
                  <input type="range" id="xZoom" min="1" max="20" value="1" step="0.1">
                </label>
              </div>

              <div class="peak-picker-control">
                <div class="engineTitle">
                  <span class="engineName">Partial Selector</span>
                </div>

                <label class="small">
                  Threshold:
                  <div class="slider-row">
                    <input id="threshFrac" type="range" min="0.05" max="0.60" value="0.20" step="0.01">
                    <span id="threshFracVal">0.20</span>
                  </div>
                </label>

                <label class="small">
                  Max peaks:
                  <div class="slider-row">
                    <input id="maxPeaksPicked" type="range" min="1" max="20" value="7" step="1">
                    <span id="maxPeaksVal">7</span>
                  </div>
                </label>

                <label class="small">
                  Min sep (Hz):
                  <div class="slider-row">
                    <input id="minSepHz" type="range" min="5" max="120" value="30" step="1">
                    <span id="minSepHzVal">30</span>
                  </div>
                </label>

                <label class="small">
                  fMin (Hz):
                  <div class="slider-row">
                    <input id="peakFMin" type="range" min="20" max="400" value="60" step="1">
                    <span id="peakFMinVal">60</span>
                  </div>
                </label>
              </div>
            </div>
          </div>

          <div class="dissonance-section">
            <div class="col viz-box">
              <div class="engineTitle">
                <span class="engineName">Dissonance Curve</span>
              </div>

              <div class="curve-row">
                <div class="canvas-with-slider">
                  <canvas id="viz2"></canvas>
                  <label class="small sliderLabel">
                    <div class="sliderHeader">
                      <span class="sliderTitle">Interval Selector:</span>
                      <span class="sliderValue" id="auditionCentsVal">0</span>
                    </div>
                    <input id="auditionCents" type="range" min="0" max="1200" value="0" step="1">
                  </label>
                  <button id="auditionPlay" class="previewBtn">▶ Play interval</button>
                </div>

                <div class="overlay-control">
                  <label class="small">
                    Interval overlay:
                    <select id="intervalOverlay">
                      <option value="none">None</option>
                      <option value="just" selected>Just Intonation</option>
                      <option value="pyth">Pythagorean</option>
                      <option value="12tet">12-TET</option>
                      <option value="slendro">Javanese Slendro</option>
                      <option value="pelog">Javanese Pelog</option>
                    </select>
                  </label>
                </div>
              </div>
            </div>

            <div class="col meter-module">
              <div class="engineTitle">
                <span class="engineName">Live Meter</span>
              </div>

              <div class="dissonance-meter-vertical">
                <div id="dissonanceMeter">
                  <div id="dissonanceMeterFill"></div>
                </div>
                <div class="meter-value" id="dissonanceMeterVal">—</div>
              </div>

              <canvas id="dissonanceTimeline"></canvas>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  </div>
  </div>


  <script src="fft.js"></script>
  <script src="peak-picking.js"></script>
  <script src="static-spectrum.js"></script>
  <script src="sethares.js"></script>
  <script src="dissonance-meter.js"></script> <!-- ADD THIS -->
  <script src="group-bus.js"></script>
  <script src="viz.js"></script>
  <script src="viz2.js"></script>
  <script src="tracks.js"></script>
  <script src="main.js"></script>
</body>

</html>
