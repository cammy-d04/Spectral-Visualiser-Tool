<!doctype html>

<!---UI skeleton of project-->
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Consonance and Dissonance Visualisation</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #FCC158;
      color: #000000;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #layout {
      display: flex;
      width: 100%;
      max-width: 1500px;
      gap: 16px;
      align-items: flex-start;
    }

    #sidebar {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 300px;
      flex-shrink: 0;
      background: #8d8d8d;
      padding-right: 12px;
      padding-left: 12px;
      padding-top: 12px;
      padding-bottom: 12px;
      border-radius: 12px;

      /* scrollable stuff */
      height: calc(100vh - 80px);
      /* adjust if header is taller/shorter */
      overflow-y: auto;
      overflow-x: hidden;

    }

    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 12px;
      min-width: 0;
      /* stops overflow issues */
    }

    #maincontrols {
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      /* wraps nicely on smaller widths */
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 10px;
      background: #c7c7c7;
      border: 1px solid #373737;
      border-radius: 8px;
    }

    #visualisations {
      flex: 1;
      min-width: 0;
    }

    #vizRow {
      display: flex;
      align-items: flex-start;
      gap: 16px;
      width: 100%;
    }




    #tuningPanel {
      width: 320px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    h1 {
      font-size: 1.1rem;
      margin-top: 1rem;
      margin-bottom: 0.5rem;
      font-weight: 600;
    }

    .row {
      display: flex;
      gap: 16px;
      align-items: flex-start;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 10px;
      max-width: 1100px;
      width: 100%;
    }


    .previewBtn {
      align-self: flex-start;
      padding: 3px 10px;
      font-size: 13px;
      cursor: pointer;
      border: 1px solid #555;
      border-radius: 4px;
      background: #e8e8e8;
      margin: 2px 0 4px 0;
    }

    .previewBtn.previewing {
      background: #ffd0d0;
      border-color: rgb(0, 133, 9);
      color: rgb(117, 180, 1);
    }
    .engineName {
  font-weight: 600;
}

    .controls {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
      justify-content: flex-start;
    }

    canvas {
      background: #fff;
      width: 100%;
      margin: 8px 0;
      border: 1px solid #ccc;
    }

#sidebar .col > label:first-of-type {
  background: #b0b0b0;
  padding: 6px 8px;
  border-radius: 4px;
  margin-left: -4px;
  margin-right: -4px;
}
    #viz {
      height: 35vh;
    }

    #viz2 {
      height: 23vh;
    }

    #visualisations h4 {
      margin: 2px 0;
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      /* wraps nicely on smaller widths */
      align-items: center;
      gap: 10px;
      width: 97.5%;
      padding: 10px;
      background: #c7c7c7;
      border-radius: 8px;
    }

    #auditionCents {
      width: 100%;
    }

.engineTitle {
  margin-bottom: 6px;
}

    button,
    input,
    select {
      margin: 0.5em;
      font-size: 14px;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      color: #555;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
    }

    input[type="range"] {
      width: 240px;
    }

    .col {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 2px;
      min-width: 260px;
      
      border-radius: 8px;
      padding: 8px 12px;
      background: #c7c7c7;
    }

    label {
      display: flex;
      flex-direction: column;
      font-size: 14px;
      line-height: 1.3;
      gap: 0;
    }

    label.small {
      font-size: 13px;
      line-height: 1.3;
    }

    #pianoControlsA {
      border-top: 1px solid #ddd;
      margin-top: 4px;
      padding-top: 4px;
    }

    .note {
      font-size: 12px;
      color: #666;
      line-height: 1.3;
      max-width: 240px;
      margin-top: -4px;
      margin-bottom: 4px;
    }

    .sliderLabel {
      display: flex;
      flex-direction: column;
      gap: 2px;
      margin: 0;
    }

    .sliderHeader {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      width: 100%;
    }

    .sliderTitle {
      text-align: left;
    }

    .sliderValue {
      text-align: right;
      min-width: 48px;
    }

    input[type="range"] {
      width: 100%;
      margin: 0;
    }

.trackBottomRow {
  display: flex;
  justify-content: space-between;
  align-items: end;
  width: auto;
  gap: 10px;
  margin-top: 4px;
  margin-left: -4px;
  margin-right: -4px;
  background: #b0b0b0;
  padding: 6px 8px;
  border-radius: 4px;
  box-sizing: border-box;
}

    .groupControl {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      margin: 0;
    }

    .groupLabel {
      margin-bottom: 2px;
    }

    .previewBtn {
      margin: 0;
      align-self: flex-end;
    }
  </style>
</head>

<body>

        <label class="small sliderLabel">

          <button id="previewBtnA" class="previewBtn"
            onclick="{ const t=tracks.find(t=>t.id==='A'); t?._previewSrc ? t.previewStop() : t?.previewPlay(); }">
            ▶ Preview

    <div id="main">

          <canvas id="viz"></canvas>
          <h4>Dissonance Curve</h4>
          <canvas id="viz2"></canvas>

          <div class="col" style="min-width:320px;">
            <div style="font-weight:600;margin-bottom:1px;">Play interval</div>

            <label class="small">
              Cents: <span id="auditionCentsVal">0</span>
              <input id="auditionCents" type="range" min="0" max="1200" value="0" step="1">
            </label>

            <button id="auditionPlay" class="previewBtn">▶ Play interval</button>
          </div>
        </div>


        <div id="tuningPanel">
          <div class="col" style="min-width:320px;">
            <div style="font-weight:600;margin-bottom:6px;">Dissonance meter</div>
            <div id="dissonanceMeter" style="
            height: 24px;
            background: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid #aaa;
          ">
              <div id="dissonanceMeterFill" style="
              height: 100%;
              width: 0%;
              background: green;
              transition: width 0.05s, background 0.05s;
            "></div>
            </div>
            <div style="font-size:12px;color:#444;margin-top:2px;">
              Dissonance: <span id="dissonanceMeterVal">—</span>
            </div>
          </div>

          <div class="col" style="min-width:320px;">
            <div style="font-weight:600;margin-bottom:6px;">Main Controls</div>

            <label>
              X-Zoom:
              <input type="range" id="xZoom" min="1" max="20" value="1" step="0.1">
            </label>
          </div>


          <div class="col" style="min-width:320px;">
            <div style="font-weight:600;margin-bottom:6px;">Peak picker</div>

            <label class="small">
              Threshold (fraction of max bin): <span id="threshFracVal">0.20</span>
              <input id="threshFrac" type="range" min="0.05" max="0.60" value="0.20" step="0.01">
            </label>

            <label class="small">
              Max peaks picked: <span id="maxPeaksVal">7</span>
              <input id="maxPeaksPicked" type="range" min="1" max="20" value="7" step="1">
            </label>

            <label class="small">
              Min separation (Hz): <span id="minSepHzVal">30</span>
              <input id="minSepHz" type="range" min="5" max="120" value="30" step="1">
            </label>

            <label class="small">
              Peak fMin (Hz): <span id="peakFMinVal">60</span>
              <input id="peakFMin" type="range" min="20" max="400" value="60" step="1">
            </label>
          </div>


          <div class="col" style="min-width:320px;">
            <div style="font-weight:600;margin-bottom:6px;">Dissonance curve</div>

            <label class="small">

                <option value="none">None</option>
                <option value="just" selected>Just Intonation</option>
                <option value="pyth">Pythagorean</option>
                <option value="12tet">12-TET</option>
                <option value="slendro">Javanese Slendro</option>
                <option value="pelog">Javanese Pelog</option>
              </select>
            </label>
